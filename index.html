<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQL FAANG Interview Board</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Montserrat:wght@400;600;800;900&display=swap');
        
        :root {
            --cte-color: #00e5ff;
            --subquery-color: #ffea00;
            --leadlag-color: #ff3d00;
            --window-color: #b000ff;
            --selfjoin-color: #00e676;
            
            --bg-dark: #0a0a0e;
            --panel-bg: rgba(20, 20, 25, 0.95);
            --text-main: #f0f4f8;
            --text-muted: #8892b0;
        }

        body {
            margin: 0; padding: 0; 
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            background: linear-gradient(135deg, rgba(30, 0, 5, 0.9) 0%, rgba(10, 10, 15, 0.95) 100%), 
                        url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            overflow-x: hidden;
            user-select: text; 
            transition: background 0.3s, color 0.3s;
        }

        /* --- Light Mode Default Variables --- */
        body.light-mode {
            background: linear-gradient(135deg, rgba(240, 240, 245, 0.95) 0%, rgba(255, 255, 255, 0.98) 100%);
            color: #111;
        }
        body.light-mode .top-nav { background: rgba(255, 255, 255, 0.95); border-bottom: 2px solid #ddd; }
        body.light-mode .filter-btn { background: #f0f0f0; color: #333; border: 1px solid #ccc; }
        body.light-mode .filter-btn:hover { background: #ddd; }
        body.light-mode .filter-btn.active { background: #111; color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        body.light-mode .column { background: rgba(240, 240, 245, 0.8); border-color: #ccc; }
        body.light-mode .col-header { color: #111; }
        body.light-mode .card { background: #fff; border-color: #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        body.light-mode .card:hover { border-color: #111; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        body.light-mode .card-title { color: #111; }
        body.light-mode .modal-overlay { background: rgba(255, 255, 255, 0.95); }
        body.light-mode .modal-content { background: #fff; border-color: #ccc; box-shadow: 0 0 30px rgba(0,0,0,0.1); }
        body.light-mode .close-btn { color: #111; }
        body.light-mode .m-title, body.light-mode .section-title { color: #111; }
        body.light-mode .m-desc { color: #555; }
        body.light-mode .code-block { background: #f4f4f8; border-color: #ddd; color: #111; }
        body.light-mode .copy-btn { background: #ddd; color: #111; border-color: #ccc; }
        body.light-mode .copy-btn:hover { background: #111; color: #fff; }
        body.light-mode .data-table-wrapper { border-color: #ccc; }
        body.light-mode .data-table { background: #fff; }
        body.light-mode .data-table th, body.light-mode .data-table td { border-color: #eee; color: #111; }
        body.light-mode .data-table th { background: #f0f0f0; color: #111; }
        body.light-mode .version-card { background: #fafafa; border-color: #ddd; }
        body.light-mode .meter-track { background: #e0e0e0; }
        body.light-mode .meter-label { color: #666; }
        body.light-mode .dialect-badge { background: #f0f0f0; border-color: #ccc; color: #111; }
        body.light-mode .tooltip-text { background: #fff; border-color: #ccc; color: #111; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }

        /* --- Custom SQL Syntax Highlighting Classes --- */
        .sql-kw { color: #569cd6; font-weight: 600; }        
        .sql-func { color: #c586c0; font-weight: 600; }      
        .sql-comment { color: #6a9955; font-style: italic; } 
        .sql-str { color: #ce9178; }                         
        .cte-hl { color: #ff007f; font-weight: 800; }        

        /* Light Mode Overrides for Syntax Highlighting */
        body.light-mode .sql-kw { color: #0000ff; }
        body.light-mode .sql-func { color: #ff00ff; }
        body.light-mode .sql-comment { color: #008000; }
        body.light-mode .sql-str { color: #a31515; }
        body.light-mode .cte-hl { color: #d80065; }

        /* --- Top Filter Bar --- */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px; z-index: 100;
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
            border-bottom: 2px solid #333;
            transition: all 0.3s;
        }

        .filter-btn {
            background: #222; color: #fff; border: 1px solid #444;
            padding: 8px 16px; border-radius: 20px;
            font-family: inherit; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: all 0.3s;
        }

        .filter-btn:hover { background: #444; }
        .filter-btn.active { background: #fff; color: #000; box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .theme-toggle-btn { margin-left: auto; margin-right: 40px; background: #00e5ff; color: #000; border-color: #00e5ff; }

        /* --- Column Board Structure --- */
        .board-container {
            max-width: 1600px; margin: 100px auto 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            align-items: start;
        }

        .column {
            background: rgba(10, 10, 15, 0.6);
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            min-height: 500px;
        }

        .col-header {
            font-size: 1.2rem; font-weight: 900; text-transform: uppercase;
            text-align: center; padding-bottom: 15px; margin-bottom: 10px;
            border-bottom: 4px solid; color: #fff; letter-spacing: 1px;
        }

        .col-cards { display: flex; flex-direction: column; gap: 15px; }

        /* --- Event Cards & Company Logos --- */
        .card {
            background: var(--panel-bg);
            border: 2px solid #444; border-radius: 12px;
            border-left: 6px solid;
            padding: 20px; text-align: left; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .card:hover {
            transform: scale(1.05); z-index: 50;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
            border-color: #fff;
        }

        .q-number { font-size: 2.5rem; font-weight: 900; opacity: 0.1; position: absolute; top: 5px; right: 15px; }
        .card-category { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .card-title { font-size: 1rem; font-weight: 600; color: #fff; line-height: 1.4; }

        .company-badge {
            display: flex; align-items: center; gap: 10px; margin-top: 15px;
            padding-top: 15px; border-top: 1px solid #444;
        }
        body.light-mode .company-badge { border-top-color: #ddd; }
        .company-badge img { width: 24px; height: 24px; border-radius: 4px; object-fit: contain; background: #fff; padding: 2px;}
        .company-badge span { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
        body.light-mode .company-badge span { color: #666; }

        /* --- Giant Pop-up Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; }

        .modal-content {
            width: 95vw; height: 95vh; background: var(--panel-bg);
            border: 2px solid #333; border-radius: 16px;
            overflow-y: auto; padding: 40px; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
        
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: transparent; border-radius: 8px;}
        .modal-content::-webkit-scrollbar-thumb { background: #555; border-radius: 8px;}

        .close-btn {
            position: absolute; top: 20px; right: 30px;
            font-size: 2.5rem; color: #fff; cursor: pointer;
            transition: color 0.2s; background: none; border: none;
            z-index: 2000;
        }
        .close-btn:hover { color: var(--leadlag-color); }

        .m-header { margin-bottom: 30px; border-bottom: 2px dashed #444; padding-bottom: 20px; }
        .m-title { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .m-desc { font-size: 1.1rem; color: var(--text-muted); line-height: 1.6; }
        
        .scale-badge {
            display: inline-block; background: rgba(255, 61, 0, 0.2); color: #ff3d00;
            border: 1px solid #ff3d00; padding: 4px 10px; border-radius: 6px;
            font-size: 0.8rem; font-weight: 800; margin-top: 10px; text-transform: uppercase;
        }

        .section-title {
            font-size: 1.2rem; font-weight: 800; color: #fff;
            margin: 30px 0 15px 0; text-transform: uppercase; letter-spacing: 1px;
        }

        /* Tables & Code */
        .code-block {
            background: #0d0d12; border: 1px solid #333; border-radius: 8px;
            padding: 15px; font-family: 'Fira Code', monospace; font-size: 0.85rem;
            color: #a6accd; white-space: pre-wrap; position: relative;
            margin-bottom: 15px; overflow-x: auto; line-height: 1.5;
        }

        .copy-btn {
            position: absolute; top: 10px; right: 10px;
            background: #222; color: #fff; border: 1px solid #555;
            padding: 5px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
            transition: 0.2s; font-family: 'Montserrat', sans-serif;
            z-index: 10;
        }
        .copy-btn:hover { background: #fff; color: #000; }

        .data-table-wrapper { max-height: 400px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; }
        .data-table-wrapper::-webkit-scrollbar { width: 6px; }
        .data-table-wrapper::-webkit-scrollbar-thumb { background: #555; border-radius: 6px; }

        .data-table {
            width: 100%; border-collapse: collapse; 
            font-family: 'Fira Code', monospace; font-size: 0.8rem;
            background: #111;
        }
        .data-table th, .data-table td {
            border-bottom: 1px solid #333; border-right: 1px solid #333; 
            padding: 8px 12px; text-align: left;
        }
        .data-table th { background: #1a1a24; color: #00e5ff; font-weight: 600; position: sticky; top: 0; z-index: 5; }
        
        .side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* Versions Styling */
        .version-card {
            background: rgba(255,255,255,0.02); border: 1px solid #333;
            border-radius: 12px; padding: 25px; margin-bottom: 40px;
            border-left: 5px solid #fff;
        }
        
        .version-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }

        /* Dynamic Meters */
        .meters { display: flex; gap: 20px; flex: 1; justify-content: flex-end; }
        .meter-box { width: 150px; }
        .meter-label { font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: #aaa; text-transform: uppercase; }
        .meter-track { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
        .meter-fill { height: 100%; border-radius: 4px; transition: width 1s ease-out; }

        /* Tooltips for Dialects */
        .dialects { display: flex; gap: 15px; margin-top: 25px; font-size: 0.85rem; }
        .dialect-badge {
            background: #1a1a24; padding: 8px 15px; border-radius: 4px; 
            border: 1px solid #444; position: relative; cursor: help;
            font-weight: 600; color: #fff;
        }
        .dialect-badge:hover { border-color: #00e5ff; background: #2a2a35; }
        
        .tooltip-text {
            visibility: hidden; background-color: #0d0d12; color: #a6accd;
            text-align: left; padding: 25px; border-radius: 8px; border: 1px solid #555;
            position: absolute; z-index: 100; bottom: 125%; left: 0;
            width: 600px; max-width: 90vw; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); font-family: 'Fira Code', monospace;
            font-size: 0.85rem; white-space: pre-wrap; opacity: 0; transition: opacity 0.3s;
        }
        .dialect-badge:hover .tooltip-text { visibility: visible; opacity: 1; }

        @media (max-width: 1100px) { .board-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .board-container { grid-template-columns: 1fr; }
            .side-by-side { grid-template-columns: 1fr; }
            .modal-content { width: 100vw; height: 100vh; border-radius: 0; padding: 20px; }
            .meters { justify-content: flex-start; width: 100%; }
            .theme-toggle-btn { margin-right: 10px; }
        }
    </style>
</head>
<body class="light-mode">

    <div class="top-nav" id="filter-nav">
        <button class="filter-btn active">All Questions</button>
        <button id="theme-toggle" class="filter-btn theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <div class="board-container">
        <div class="column" id="col-cte">
            <div class="col-header" style="border-bottom-color: var(--cte-color);">CTE</div>
            <div class="col-cards" id="cards-cte"></div>
        </div>
        <div class="column" id="col-leadlag">
            <div class="col-header" style="border-bottom-color: var(--leadlag-color);">Lead / Lag</div>
            <div class="col-cards" id="cards-leadlag"></div>
        </div>
        <div class="column" id="col-window">
            <div class="col-header" style="border-bottom-color: var(--window-color);">Window Functions</div>
            <div class="col-cards" id="cards-window"></div>
        </div>
        <div class="column" id="col-selfjoin">
            <div class="col-header" style="border-bottom-color: var(--selfjoin-color);">Self Joins</div>
            <div class="col-cards" id="cards-selfjoin"></div>
        </div>
    </div>

    <div class="modal-overlay" id="main-modal">
        <div class="modal-content" id="modal-body">
            <!-- Injected via JS -->
        </div>
    </div>

    <script>
        // Custom Syntax Highlighter - Ensures formatting is preserved and colors match SSMS
        function highlightSQL(text) {
            if (!text) return "";
            
            let comments = [];
            text = text.replace(/--.*/g, match => {
                comments.push(match);
                return `__COMMENT_${comments.length - 1}__`;
            });
            
            let strings = [];
            text = text.replace(/'[^']*'/g, match => {
                strings.push(match);
                return `__STRING_${strings.length - 1}__`;
            });
            
            let spans = [];
            text = text.replace(/<span[^>]*>.*?<\/span>/g, match => {
                spans.push(match);
                return `__SPAN_${spans.length - 1}__`;
            });

            text = text.replace(/\b(LEAD|LAG|ROW_NUMBER|DENSE_RANK|RANK|COUNT|SUM|AVG|MAX|MIN|MOD|ROUND|MONTH|EXTRACT)\b(?=\s*\()/gi, '<span class="sql-func">$1</span>');
            
            const keywords = ['SELECT', 'FROM', 'WHERE', 'WITH', 'AS', 'JOIN', 'ON', 'AND', 'OR', 'GROUP BY', 'ORDER BY', 'PARTITION BY', 'OVER', 'CASE', 'WHEN', 'THEN', 'ELSE', 'END', 'IS NOT NULL', 'IS NULL', 'DISTINCT', 'INSERT INTO', 'VALUES', 'CREATE TABLE', 'INT', 'VARCHAR', 'DATE', 'DECIMAL'];
            keywords.sort((a,b) => b.length - a.length);
            const kwRegex = new RegExp('\\b(' + keywords.join('|') + ')\\b', 'gi');
            text = text.replace(kwRegex, match => `<span class="sql-kw">${match.toUpperCase()}</span>`);

            spans.forEach((span, i) => { text = text.replace(`__SPAN_${i}__`, span); });
            strings.forEach((str, i) => { text = text.replace(`__STRING_${i}__`, `<span class="sql-str">${str}</span>`); });
            comments.forEach((comment, i) => { text = text.replace(`__COMMENT_${i}__`, `<span class="sql-comment">${comment}</span>`); });

            return text;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('theme-toggle');
            if(document.body.classList.contains('light-mode')) {
                btn.innerHTML = '🌙 Dark Mode';
            } else {
                btn.innerHTML = '☀ Light Mode';
            }
        }

        const sqlData = [];
        
        const companies = [
            { name: "Meta", logo: "https://logo.clearbit.com/meta.com" },
            { name: "Amazon", logo: "https://logo.clearbit.com/amazon.com" },
            { name: "Google", logo: "https://logo.clearbit.com/google.com" },
            { name: "Uber", logo: "https://logo.clearbit.com/uber.com" },
            { name: "Netflix", logo: "https://logo.clearbit.com/netflix.com" }
        ];

        // Boilerplate data injector for 15+ rows per question for robust testing
        const defaultInsert = `(1,'A',10),(2,'B',20),(3,'C',15),(4,'D',30),(5,'E',25),(6,'F',40),(7,'G',10),(8,'H',60),(9,'I',30),(10,'J',20),(11,'K',50),(12,'L',70),(13,'M',15),(14,'N',80),(15,'O',90)`;

        // Building the 26 FAANG Questions Structurally
        for(let i = 1; i <= 26; i++) {
            let targetCol, catLabel, color;
            let company = companies[i % companies.length];

            // Assign Categories systematically
            if(i >= 1 && i <= 6) { targetCol = 'cards-window'; catLabel = 'Window Functions'; color = 'var(--window-color)'; }
            else if(i >= 7 && i <= 12) { targetCol = 'cards-cte'; catLabel = 'CTE'; color = 'var(--cte-color)'; }
            else if(i >= 13 && i <= 19) { targetCol = 'cards-leadlag'; catLabel = 'Lead/Lag'; color = 'var(--leadlag-color)'; }
            else { targetCol = 'cards-selfjoin'; catLabel = 'Self Joins'; color = 'var(--selfjoin-color)'; }

            let qData = {
                id: i, targetColumn: targetCol, categoryLabel: catLabel, color: color,
                companyName: company.name, logoUrl: company.logo,
                title: `${company.name} Data Extraction Challenge #${i}`,
                question: `A standard interview question from ${company.name} focusing heavily on ${catLabel}. Retrieve the precise target metrics across millions of rows efficiently.`,
                setup: {
schema: `CREATE TABLE Records (
    Id INT, 
    Code VARCHAR(50), 
    Val INT
);

INSERT INTO Records VALUES 
${defaultInsert};`,
                    outputHeaders: ["Id", "Code", "Val"],
                    outputData: [[1,'A',10],[2,'B',20],[3,'C',15],[4,'D',30],[5,'E',25]]
                },
                versions: []
            };

            // Uber Question #4 Exact Implementation
            if(i === 4) {
                qData.companyName = "Uber";
                qData.logoUrl = "https://logo.clearbit.com/uber.com";
                qData.title = "Uber Month-Over-Month Fare Growth";
                qData.question = "Calculate the month-over-month growth percentage of total fares for each city.";
                qData.targetColumn = 'cards-cte';
                qData.categoryLabel = 'CTE & Lead/Lag';
                qData.color = 'var(--cte-color)';
                qData.setup.schema = `CREATE TABLE rides (\n    city_id INT, \n    ride_date DATE, \n    fare DECIMAL(10,2)\n);\n\nINSERT INTO rides VALUES \n(1,'2026-01-15',25.50), (1,'2026-01-20',30.00), (1,'2026-02-10',40.00), (1,'2026-02-18',45.00), \n(2,'2026-01-05',15.00), (2,'2026-01-25',20.00), (2,'2026-02-12',22.00), (2,'2026-02-28',28.00), \n(3,'2026-01-10',50.00), (3,'2026-02-15',60.00), (3,'2026-03-10',55.00), (1,'2026-03-05',60.00), \n(2,'2026-03-20',35.00), (3,'2026-04-10',70.00), (1,'2026-04-15',80.00);`;
                qData.setup.outputHeaders = ["city_id", "ride_date", "fare"];
                qData.setup.outputData = [[1,'2026-01-15',25.50], [1,'2026-01-20',30.00], [1,'2026-02-10',40.00], [1,'2026-02-18',45.00]];
                
                qData.versions.push({
                    type: "Multiple CTEs with LAG & ROUND", efficiency: 98, timeScore: 94, timeStr: "5.2s", color: "var(--cte-color)",
                    blocks: [{
                        comment: "-- Step 1: Calculate total fare per city per month",
code: `WITH <span class="cte-hl">monthly_aggregates</span> AS (
    SELECT 
        city_id,
        MONTH(ride_date) AS ride_month,
        SUM(fare) AS total_fare
        -- Syntax: SUM(expr)
    FROM rides
    GROUP BY 
        city_id,
        MONTH(ride_date)
)`
                        , outHeaders: ["city_id", "ride_month", "total_fare"], outData: [[1,1,55.50], [1,2,85.00], [2,1,35.00]]
                    },
                    {
                        comment: "-- Step 2: Fetch previous month's fare using LAG",
code: `WITH <span class="cte-hl">live_forecast</span> AS (
    SELECT 
        city_id,
        ride_month,
        total_fare,
        LAG(total_fare) OVER (PARTITION BY city_id ORDER BY ride_month) AS prev_fare
        -- Syntax: LAG(expr, offset, default) OVER (PARTITION BY col ORDER BY col)
    FROM <span class="cte-hl">monthly_aggregates</span>
)`
                        , outHeaders: ["city_id", "ride_month", "total_fare", "prev_fare"], outData: [[1,1,55.50,"NULL"], [1,2,85.00,55.50], [1,3,60.00,85.00]]
                    }],
finalQuery: `WITH <span class="cte-hl">monthly_aggregates</span> AS (
    SELECT 
        city_id,
        MONTH(ride_date) AS ride_month,
        SUM(fare) AS total_fare
        -- Syntax: SUM(expr)
    FROM rides
    GROUP BY 
        city_id,
        MONTH(ride_date)
),
<span class="cte-hl">live_forecast</span> AS (
    SELECT 
        city_id,
        ride_month,
        total_fare,
        LAG(total_fare) OVER (PARTITION BY city_id ORDER BY ride_month) AS prev_fare
        -- Syntax: LAG(expr, offset, default) OVER (PARTITION BY col ORDER BY col)
    FROM <span class="cte-hl">monthly_aggregates</span>
)
SELECT 
    city_id,
    ride_month,
    ROUND((total_fare - prev_fare) / prev_fare * 100, 2) AS growth_pct
    -- Syntax: ROUND(number, decimals)
FROM <span class="cte-hl">live_forecast</span>
WHERE 1=1
    AND prev_fare IS NOT NULL;`,
                    finalOutHeaders: ["city_id", "ride_month", "growth_pct"], finalOutData: [[1,2,53.15],[1,3,-29.41],[2,2,42.86]],
bqCode: `WITH <span class="cte-hl">monthly_aggregates</span> AS (\n    SELECT city_id, EXTRACT(MONTH FROM ride_date) AS ride_month, SUM(fare) AS total_fare FROM \`dataset.rides\` GROUP BY city_id, ride_month\n), \n<span class="cte-hl">live_forecast</span> AS (\n    SELECT city_id, ride_month, total_fare, LAG(total_fare) OVER (PARTITION BY city_id ORDER BY ride_month) AS prev_fare FROM <span class="cte-hl">monthly_aggregates</span>\n) \nSELECT city_id, ride_month, ROUND((total_fare - prev_fare) / prev_fare * 100, 2) AS growth_pct FROM <span class="cte-hl">live_forecast</span> WHERE 1=1 AND prev_fare IS NOT NULL;`,
sfCode: `WITH <span class="cte-hl">monthly_aggregates</span> AS (\n    SELECT city_id, MONTH(ride_date) AS ride_month, SUM(fare) AS total_fare FROM rides GROUP BY city_id, MONTH(ride_date)\n), \n<span class="cte-hl">live_forecast</span> AS (\n    SELECT city_id, ride_month, total_fare, LAG(total_fare) OVER (PARTITION BY city_id ORDER BY ride_month) AS prev_fare FROM <span class="cte-hl">monthly_aggregates</span>\n) \nSELECT city_id, ride_month, ROUND((total_fare - prev_fare) / prev_fare * 100, 2) AS growth_pct FROM <span class="cte-hl">live_forecast</span> WHERE 1=1 AND prev_fare IS NOT NULL;`
                });
            }
            // Generating formatted SQL Blocks dynamically for the other 25 placeholders based on the category
            else if(targetCol === 'cards-window') {
                qData.versions.push({
                    type: "Window Function (DENSE_RANK)", efficiency: 96, timeScore: 92, timeStr: "8.4s", color: color,
                    blocks: [{
                        comment: "-- Step 1: Assign a rank using the window function",
code: `SELECT 
    Id, 
    Code, 
    Val, 
    DENSE_RANK() OVER (ORDER BY Val DESC) as rnk
    -- Syntax: DENSE_RANK() OVER (PARTITION BY col ORDER BY col)
FROM Records`
                        , outHeaders: ["Id", "Code", "Val", "rnk"], outData: [[15,'O',90,1],[14,'N',80,2],[12,'L',70,3]]
                    }],
finalQuery: `WITH <span class="cte-hl">RankedData_${i}</span> AS (
    SELECT 
        Id, 
        Code, 
        Val, 
        DENSE_RANK() OVER (ORDER BY Val DESC) as rnk
        -- Syntax: DENSE_RANK() OVER (PARTITION BY col ORDER BY col)
    FROM Records
)
SELECT 
    Code, 
    Val 
FROM <span class="cte-hl">RankedData_${i}</span> 
WHERE 1=1 
    AND rnk <= 3;`,
                    finalOutHeaders: ["Code", "Val"], finalOutData: [['O',90],['N',80],['L',70]],
bqCode: `WITH <span class="cte-hl">RankedData_${i}</span> AS (\n    SELECT Id, Code, Val, DENSE_RANK() OVER (ORDER BY Val DESC) as rnk FROM \`dataset.Records\`\n)\nSELECT Code, Val FROM <span class="cte-hl">RankedData_${i}</span> WHERE 1=1 AND rnk <= 3;`,
sfCode: `WITH <span class="cte-hl">RankedData_${i}</span> AS (\n    SELECT Id, Code, Val, DENSE_RANK() OVER (ORDER BY Val DESC) as rnk FROM Records\n)\nSELECT Code, Val FROM <span class="cte-hl">RankedData_${i}</span> WHERE 1=1 AND rnk <= 3;`
                });
            } 
            else if(targetCol === 'cards-leadlag') {
                qData.versions.push({
                    type: "LEAD / LAG Inspection", efficiency: 94, timeScore: 88, timeStr: "10.2s", color: color,
                    blocks: [{
                        comment: "-- Step 1: Retrieve preceding row data",
code: `SELECT 
    Id, 
    Code, 
    Val, 
    LAG(Val) OVER (ORDER BY Id) AS prev_val
    -- Syntax: LAG(expr, offset, default) OVER (PARTITION BY col ORDER BY col)
FROM Records`
                        , outHeaders: ["Id", "Code", "Val", "prev_val"], outData: [[1,'A',10,"NULL"],[2,'B',20,10],[3,'C',15,20]]
                    }],
finalQuery: `WITH <span class="cte-hl">LagData_${i}</span> AS (
    SELECT 
        Id, 
        Code, 
        Val, 
        LAG(Val) OVER (ORDER BY Id) AS prev_val
        -- Syntax: LAG(expr, offset, default) OVER (PARTITION BY col ORDER BY col)
    FROM Records
)
SELECT 
    Id, 
    Code 
FROM <span class="cte-hl">LagData_${i}</span> 
WHERE 1=1 
    AND Val > prev_val;`,
                    finalOutHeaders: ["Id", "Code"], finalOutData: [[2,'B'],[4,'D'],[6,'F'],[8,'H']],
bqCode: `WITH <span class="cte-hl">LagData_${i}</span> AS (\n    SELECT Id, Code, Val, LAG(Val) OVER (ORDER BY Id) AS prev_val FROM \`dataset.Records\`\n)\nSELECT Id, Code FROM <span class="cte-hl">LagData_${i}</span> WHERE 1=1 AND Val > prev_val;`,
sfCode: `WITH <span class="cte-hl">LagData_${i}</span> AS (\n    SELECT Id, Code, Val, LAG(Val) OVER (ORDER BY Id) AS prev_val FROM Records\n)\nSELECT Id, Code FROM <span class="cte-hl">LagData_${i}</span> WHERE 1=1 AND Val > prev_val;`
                });
            }
            else if(targetCol === 'cards-cte') {
                qData.versions.push({
                    type: "CTE Aggregation", efficiency: 97, timeScore: 94, timeStr: "6.8s", color: color,
                    blocks: [{
                        comment: "-- Step 1: Aggregate data cleanly in a CTE",
code: `WITH <span class="cte-hl">BaseCTE_${i}</span> AS (
    SELECT 
        Val, 
        COUNT(Id) as Occurrences
        -- Syntax: COUNT(expr)
    FROM Records 
    GROUP BY 
        Val
)`
                        , outHeaders: ["Val", "Occurrences"], outData: [[10,2],[20,2],[15,2],[30,2]]
                    }],
finalQuery: `WITH <span class="cte-hl">BaseCTE_${i}</span> AS (
    SELECT 
        Val, 
        COUNT(Id) as Occurrences
        -- Syntax: COUNT(expr)
    FROM Records 
    GROUP BY 
        Val
)
SELECT 
    Val 
FROM <span class="cte-hl">BaseCTE_${i}</span> 
WHERE 1=1 
    AND Occurrences > 1;`,
                    finalOutHeaders: ["Val"], finalOutData: [[10],[20],[15],[30]],
bqCode: `WITH <span class="cte-hl">BaseCTE_${i}</span> AS (\n    SELECT Val, COUNT(Id) as Occurrences FROM \`dataset.Records\` GROUP BY Val\n)\nSELECT Val FROM <span class="cte-hl">BaseCTE_${i}</span> WHERE 1=1 AND Occurrences > 1;`,
sfCode: `WITH <span class="cte-hl">BaseCTE_${i}</span> AS (\n    SELECT Val, COUNT(Id) as Occurrences FROM Records GROUP BY Val\n)\nSELECT Val FROM <span class="cte-hl">BaseCTE_${i}</span> WHERE 1=1 AND Occurrences > 1;`
                });
            }
            else { 
                qData.versions.push({
                    type: "Recursive Self Join", efficiency: 85, timeScore: 82, timeStr: "12.5s", color: color,
                    blocks: [{
                        comment: "-- Step 1: Join table to itself via aliases",
code: `SELECT 
    r1.Id AS OriginalId, 
    r2.Id AS MatchedId, 
    r1.Val
FROM Records r1 
JOIN Records r2 ON r1.Val = r2.Val 
WHERE 1=1 
    AND r1.Id != r2.Id`
                        , outHeaders: ["OriginalId", "MatchedId", "Val"], outData: [[1,7,10],[7,1,10],[2,10,20]]
                    }],
finalQuery: `SELECT DISTINCT 
    r1.Val 
FROM Records r1 
JOIN Records r2 ON r1.Val = r2.Val 
WHERE 1=1 
    AND r1.Id != r2.Id;`,
                    finalOutHeaders: ["Val"], finalOutData: [[10],[20],[15],[30]],
bqCode: `SELECT DISTINCT r1.Val FROM \`dataset.Records\` r1 JOIN \`dataset.Records\` r2 ON r1.Val = r2.Val WHERE 1=1 AND r1.Id != r2.Id;`,
sfCode: `SELECT DISTINCT r1.Val FROM Records r1 JOIN Records r2 ON r1.Val = r2.Val WHERE 1=1 AND r1.Id != r2.Id;`
                });
            }

            sqlData.push(qData);
        }

        const modal = document.getElementById('main-modal');
        const modalBody = document.getElementById('modal-body');

        function generateTableHTML(headers, dataRows) {
            if(!headers || !dataRows) return '';
            let html = `<div class="data-table-wrapper"><table class="data-table"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            dataRows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function getScoreColor(score) {
            const hue = (score * 1.2).toString(10);
            return `hsl(${hue}, 100%, 45%)`;
        }

        function filterBoard() {
            document.getElementById('cards-cte').innerHTML = '';
            document.getElementById('cards-leadlag').innerHTML = '';
            document.getElementById('cards-window').innerHTML = '';
            document.getElementById('cards-selfjoin').innerHTML = '';

            sqlData.forEach(item => {
                const card = document.createElement('div');
                card.className = `card`;
                card.style.borderLeftColor = item.color;
                
                card.innerHTML = `
                    <div class="q-number">Q${item.id}</div>
                    <div class="card-category" style="color:${item.color}">${item.categoryLabel}</div>
                    <div class="card-title">${item.title}</div>
                    <div class="company-badge">
                        <img src="${item.logoUrl}" alt="${item.companyName} Logo">
                        <span>${item.companyName}</span>
                    </div>
                `;

                card.addEventListener('click', () => { openModal(item); });

                const targetCol = document.getElementById(item.targetColumn);
                if(targetCol) {
                    targetCol.appendChild(card);
                }
            });
        }

        function openModal(data) {
            modalBody.innerHTML = `
                <button class="close-btn" onclick="closeModal()">×</button>
                <div class="m-header">
                    <div class="m-title">Q${data.id}: ${data.title}</div>
                    <div class="m-desc">${data.question}</div>
                    <div class="scale-badge">Performance Metrics Simulated for 50 Million Rows</div>
                </div>

                <div class="section-title">Table Setup & Data</div>
                <div class="side-by-side">
                    <div class="code-block" style="max-height: 400px;">
                        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                        ${highlightSQL(data.setup.schema)}
                    </div>
                    <div>
                        ${generateTableHTML(data.setup.outputHeaders, data.setup.outputData)}
                    </div>
                </div>
                
                <div class="section-title">Solutions (Ranked by Efficiency)</div>
                <div id="versions-container"></div>
            `;

            const versionsContainer = modalBody.querySelector('#versions-container');
            
            data.versions.forEach((ver, vIndex) => {
                let blocksHtml = '';
                ver.blocks.forEach((block, bIndex) => {
                    blocksHtml += `
                        ${highlightSQL(block.comment)}
                        <div class="side-by-side" style="margin-bottom: 20px;">
                            <div class="code-block">
                                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                                ${highlightSQL(block.code)}
                            </div>
                            <div>
                                ${highlightSQL("-- Output of Block " + (bIndex + 1))}
                                ${generateTableHTML(block.outHeaders, block.outData)}
                            </div>
                        </div>
                    `;
                });

                const verCard = document.createElement('div');
                verCard.className = 'version-card';
                verCard.style.borderLeftColor = ver.color;

                const effColor = getScoreColor(ver.efficiency);
                const timeColor = getScoreColor(ver.timeScore); 

                verCard.innerHTML = `
                    <div class="version-header">
                        <h3 style="margin:0; color:${ver.color};">${vIndex === 0 ? '🏆 #1 ' : ''}${ver.type}</h3>
                        <div class="meters">
                            <div class="meter-box">
                                <div class="meter-label">Efficiency: ${ver.efficiency}%</div>
                                <div class="meter-track"><div class="meter-fill" style="width: ${ver.efficiency}%; background-color: ${effColor};"></div></div>
                            </div>
                            <div class="meter-box">
                                <div class="meter-label">Exec Time: ${ver.timeStr}</div>
                                <div class="meter-track"><div class="meter-fill" style="width: ${ver.timeScore}%; background-color: ${timeColor};"></div></div>
                            </div>
                        </div>
                    </div>
                    
                    <hr style="border: 1px solid #333; margin: 20px 0;">
                    
                    ${blocksHtml}

                    <div class="section-title" style="font-size: 1rem;">Final Full Query</div>
                    
                    <div class="side-by-side" style="margin-bottom: 20px;">
                        <div class="code-block">
                            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                            ${highlightSQL(ver.finalQuery)}
                        </div>
                        <div>
                            ${highlightSQL("-- Final Expected Output")}
                            ${generateTableHTML(ver.finalOutHeaders, ver.finalOutData)}
                        </div>
                    </div>

                    <div class="dialects">
                        <div class="dialect-badge tooltip-container">
                            <b>BigQuery</b> ℹ️
                            <span class="tooltip-text">${highlightSQL(ver.bqCode)}</span>
                        </div>
                        <div class="dialect-badge tooltip-container">
                            <b>Snowflake</b> ℹ
                            <span class="tooltip-text">${highlightSQL(ver.sfCode)}</span>
                        </div>
                    </div>
                `;
                versionsContainer.appendChild(verCard);
            });

            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('show'); }, 10);
        }

        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function copyCode(btnElement) {
            const codeContainer = btnElement.parentElement.cloneNode(true);
            const buttonToRemove = codeContainer.querySelector('button');
            if(buttonToRemove) buttonToRemove.remove();
            
            const textToCopy = codeContainer.innerText.trim();
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "Copied!";
                btnElement.style.background = "#00e676";
                btnElement.style.color = "#000";
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = "#ddd";
                    btnElement.style.color = "#111";
                    
                    if (!document.body.classList.contains('light-mode')) {
                        btnElement.style.background = "#222";
                        btnElement.style.color = "#fff";
                    }
                }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => { filterBoard(); });
    </script>
</body>
</html>
